name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check version and changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::tag $VERSION is not semantic versioning"; exit 1; }
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no entry for ${VERSION#v}"; exit 1; }

      - name: Test
        run: go test ./...

      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -eu
          mkdir -p out
          docs="LICENSE THIRD_PARTY_NOTICES.md README.md README.en.md CHANGELOG.md"

          ./build.sh windows amd64
          name="cursor-inner-${VERSION}-windows-amd64"
          mkdir -p "out/${name}"
          cp "dist/${name}.exe" "out/${name}/cursor-inner.exe"
          cp $docs "out/${name}/"
          (cd out && zip -qr "${name}.zip" "${name}" && rm -r "${name}")
          cp "dist/${name}.exe" "out/${name}.exe"

          # Self-update needs the bare executables next to manifest.json.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ./build.sh "$os" "$arch"
            name="cursor-inner-${VERSION}-${os}-${arch}"
            mkdir -p "out/${name}"
            cp "dist/${name}" "out/${name}/cursor-inner"
            cp assets/icon.svg "out/${name}/cursor-inner.svg"
            cp $docs "out/${name}/"
            tar -C out -czf "out/${name}.tar.gz" "${name}"
            cp "dist/${name}" "out/${name}"
            rm -r "out/${name}"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: out/cursor-inner-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Update manifest
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./scripts/release_manifest.sh out "$VERSION" release-notes.md

      - name: Checksums
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          {
            cat release-notes.md
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh   # macOS / Linux"
            echo '```'
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex           # Windows"
            echo '```'
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."
          } > notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$VERSION" out/* --verify-tag --title "cursor-inner ${VERSION}" --notes-file notes.md $flags
