<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-inner</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e0d;
    --panel: #151514;
    --raise: #1b1b19;
    --field: #10100f;
    --line: rgba(244, 241, 234, .07);
    --line-strong: rgba(244, 241, 234, .14);
    --text: #f4f1ea;
    --muted: #a19d94;
    --faint: #6a675f;
    --signal: #ff5a2b;
    --signal-soft: rgba(255, 90, 43, .14);
    --good: #8bc79a;
    --good-soft: rgba(139, 199, 154, .12);
    --bad: #ff7a5c;
    --bad-soft: rgba(255, 122, 92, .12);
    --primary-bg: #f4f1ea;
    --primary-text: #151514;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 32px rgba(0, 0, 0, .35);
    --sans: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f3f2ee;
      --panel: #ffffff;
      --raise: #f7f6f3;
      --field: #fbfaf8;
      --line: rgba(21, 21, 20, .07);
      --line-strong: rgba(21, 21, 20, .15);
      --text: #151514;
      --muted: #67645e;
      --faint: #9a968e;
      --signal: #e94a1c;
      --signal-soft: rgba(233, 74, 28, .10);
      --good: #2f7a45;
      --good-soft: rgba(47, 122, 69, .09);
      --bad: #c2401f;
      --bad-soft: rgba(194, 64, 31, .08);
      --primary-bg: #151514;
      --primary-text: #f4f1ea;
      --shadow: 0 1px 2px rgba(21, 21, 20, .04), 0 8px 24px rgba(21, 21, 20, .06);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font: 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 0 28px 72px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 64px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 24px; height: 24px; display: block; }
  .brand span { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .addr {
    display: inline-flex; align-items: center; gap: 8px;
    height: 28px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    color: var(--muted); text-decoration: none;
    font-family: var(--mono); font-size: 12px;
    transition: color .15s, border-color .15s;
  }
  .addr:hover { color: var(--text); border-color: var(--faint); }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .gone { min-height: 70vh; display: grid; place-content: center; gap: 8px; text-align: center; color: var(--muted); }
  .gone h2 { color: var(--text); font-size: 15px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    margin-top: 16px;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 20px 12px;
  }
  h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
  .count {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 1px 7px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line);
  }
  .hint { margin-left: auto; color: var(--faint); font-size: 12px; }

  .row {
    display: grid; grid-template-columns: 108px minmax(0, 1fr) auto;
    gap: 6px 24px; align-items: center;
    padding: 16px 20px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .desc { margin: 0; color: var(--muted); }
  .meta { margin: 4px 0 0; color: var(--faint); font-size: 12px; white-space: pre-line; }
  .meta:empty { display: none; }
  .meta.warn { color: var(--bad); }
  .meta .ok { color: var(--good); }
  .controls { display: flex; align-items: center; gap: 8px; }

  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--raise); border: 1px solid var(--line-strong);
    transition: background .18s, border-color .18s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted);
    transition: transform .18s cubic-bezier(.3, .7, .4, 1), background .18s;
  }
  .switch input:checked + span { background: var(--signal); border-color: var(--signal); }
  .switch input:checked + span::after { transform: translateX(14px); background: #fff; }
  .switch input:focus-visible + span { outline: 2px solid var(--signal); outline-offset: 2px; }
  .switch.sm { width: 28px; height: 16px; }
  .switch.sm span::after { width: 10px; height: 10px; }
  .switch.sm input:checked + span::after { transform: translateX(12px); }

  input[type="text"], input[type="password"], select {
    width: 100%; height: 32px; padding: 0 10px;
    color: var(--text); background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 7px;
    font: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus, select:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
  #proxy-address { width: 230px; font-family: var(--mono); font-size: 12px; }

  button {
    appearance: none; height: 32px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: transparent; color: var(--text);
    font: inherit; font-weight: 500; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
  }
  button:hover { background: var(--raise); border-color: var(--faint); }
  button.primary { background: var(--primary-bg); color: var(--primary-text); border-color: transparent; }
  button.primary:hover { opacity: .88; background: var(--primary-bg); }
  button.sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  button.danger:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  button:disabled { opacity: .45; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-weight: 500; font-size: 11px; color: var(--faint);
    letter-spacing: .04em; padding: 0 20px 8px;
  }
  td { padding: 12px 20px; border-top: 1px solid var(--line); vertical-align: middle; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--raise); }
  .name { font-weight: 500; white-space: nowrap; }
  .sub { color: var(--faint); margin-top: 2px; white-space: nowrap; }
  .api { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); }
  .api .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
  .tag {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-strong); flex: none;
  }
  .speed {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 12px; white-space: nowrap;
    padding: 2px 8px; border-radius: 999px; cursor: help;
    color: var(--good); background: var(--good-soft);
  }
  .speed::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .speed.bad { color: var(--bad); background: var(--bad-soft); }
  .speed.idle { color: var(--faint); background: transparent; cursor: default; padding-left: 0; }
  .speed.idle::before { display: none; }
  td.ops { text-align: right; white-space: nowrap; }
  .ops-inner { display: inline-flex; align-items: center; gap: 6px; }
  .mini { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-right: 6px; cursor: pointer; }
  .empty { margin: 0; padding: 4px 20px 18px; color: var(--faint); }

  .add { border-top: 1px solid var(--line); padding: 16px 20px 18px; background: var(--raise); }
  .add h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: 1.1fr 140px 1fr 1.5fr 1.3fr; gap: 10px; align-items: end; }
  label.field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
  .secret { position: relative; display: block; }
  .secret input { padding-right: 34px; }
  .secret button {
    position: absolute; right: 1px; top: 1px; bottom: 1px; width: 32px; height: auto; padding: 0;
    border: 0; border-radius: 6px; background: transparent; color: var(--faint);
    display: grid; place-items: center;
  }
  .secret button:hover { color: var(--text); background: transparent; }
  .secret svg { display: block; }
  .secret svg[hidden] { display: none !important; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .actions .mini { margin-right: auto; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 10;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    max-width: min(760px, calc(100vw - 48px));
    padding: 10px 16px; border-radius: 10px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line-strong); box-shadow: var(--shadow);
    font-size: 12px; white-space: pre-wrap; cursor: pointer;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast.ok { border-color: var(--good); }
  .toast.err { border-color: var(--bad); color: var(--bad); }

  @media (max-width: 860px) {
    main { padding: 0 16px 72px; }
    .row { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr 1fr; }
    #proxy-address { width: 100%; }
    .controls { width: 100%; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand"><img src="/icon.svg" alt=""><span>cursor-inner</span></div>
    <div class="top-right">
      <a class="addr" id="listen" href="/"><i class="dot" id="live-dot"></i><span id="listen-text"></span></a>
      <button id="lang" type="button" class="sm" aria-label="Language">EN</button>
      <button id="quit" type="button" class="sm" data-i18n="quit" data-i18n-title="quitTitle" title="退出 cursor-inner，并还原 Cursor 的代理设置">退出</button>
    </div>
  </header>

  <section class="panel">
    <div class="row">
      <h2 data-i18n="takeover">接管</h2>
      <div>
        <p class="desc" data-i18n="takeoverDesc">打开时结束正在运行的 Cursor。官方模型照常从 Cursor 获取，自定义模型追加在列表后面。</p>
        <p class="meta" id="takeover-meta"></p>
      </div>
      <label class="switch"><input id="takeover" type="checkbox" data-i18n-aria="takeover" aria-label="接管"><span></span></label>
    </div>
    <div class="row">
      <h2 data-i18n="proxy">代理</h2>
      <div>
        <p class="desc" data-i18n="proxyDesc">官方模型和 Cursor 其余联网走这里。只填主机和端口时按 socks5 处理，地址留空等于不代理。</p>
        <p class="meta" id="proxy-meta"></p>
      </div>
      <div class="controls">
        <input id="proxy-address" type="text" placeholder="127.0.0.1:1080" autocomplete="off" spellcheck="false">
        <button id="proxy-save" type="button" data-i18n="save">保存</button>
        <label class="switch"><input id="proxy-on" type="checkbox" data-i18n-aria="proxy" aria-label="代理"><span></span></label>
      </div>
    </div>
    <div class="row">
      <h2 data-i18n="autostart">开机启动</h2>
      <div>
        <p class="desc" data-i18n="autostartDesc">登录系统后自动启动。反复开关始终只保留一条启动项。</p>
        <p class="meta" id="boot-meta"></p>
      </div>
      <label class="switch"><input id="autostart" type="checkbox" data-i18n-aria="autostart" aria-label="开机启动"><span></span></label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="models">自定义模型</h2>
      <span class="count" id="model-count">0</span>
      <span class="hint" data-i18n="modelsHint">测试会流式请求 1 到 120 的数字，记录速度、首字和输出</span>
    </div>
    <table id="model-table">
      <thead>
        <tr><th data-i18n="colModel">模型</th><th data-i18n="colEndpoint">接口</th><th data-i18n="colLastTest">上次测试</th><th></th></tr>
      </thead>
      <tbody id="models"></tbody>
    </table>
    <p class="empty" id="empty" data-i18n="empty">还没有自定义模型，在下面添加第一个。</p>

    <form id="model-form" class="add">
      <h3 data-i18n="addModel">添加模型</h3>
      <div class="grid">
        <label class="field"><span data-i18n="displayName">显示名</span><input name="display_name" type="text" required></label>
        <label class="field"><span data-i18n="type">类型</span>
          <select name="type">
            <option value="openai-chat">OpenAI Chat</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
        <label class="field"><span data-i18n="modelName">模型名</span><input name="model" type="text" required spellcheck="false" class="mono"></label>
        <label class="field"><span data-i18n="baseUrl">接口地址</span><input name="base_url" type="text" placeholder="https://api.example.com/v1" required spellcheck="false" class="mono"></label>
        <label class="field"><span data-i18n="apiKey">密钥</span>
          <span class="secret">
            <input id="api-key" name="api_key" type="password" required autocomplete="off" class="mono">
            <button id="reveal-key" type="button" aria-label="显示密钥" title="显示密钥">
              <svg id="eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4Z"/>
                <circle cx="8" cy="8" r="1.6"/>
                <path d="M3 13 13 3"/>
              </svg>
              <svg id="eye-on" hidden width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 8s2.5-4 6-4 6 4 6 4-2.5 4-6 4-6-4-6-4Z"/>
                <circle cx="8" cy="8" r="1.6"/>
              </svg>
            </button>
          </span>
        </label>
      </div>
      <div class="actions">
        <label class="mini"><span class="switch sm"><input name="use_proxy" type="checkbox"><span></span></span><span data-i18n="useProxy">走代理</span></label>
        <button id="draft-test" type="button" data-i18n="test">测试</button>
        <button class="primary" type="submit" data-i18n="add">添加</button>
      </div>
    </form>
  </section>
</main>
<div class="toast" id="banner" role="status"></div>
<script>
const MESSAGES = {
  zh: {
    quit: "退出", quitTitle: "退出 cursor-inner，并还原 Cursor 的代理设置",
    takeover: "接管", takeoverDesc: "打开时结束正在运行的 Cursor。官方模型照常从 Cursor 获取，自定义模型追加在列表后面。",
    proxy: "代理", proxyDesc: "官方模型和 Cursor 其余联网走这里。只填主机和端口时按 socks5 处理，地址留空等于不代理。",
    save: "保存", autostart: "开机启动", autostartDesc: "登录系统后自动启动。反复开关始终只保留一条启动项。",
    models: "自定义模型", modelsHint: "测试会流式请求 1 到 120 的数字，记录速度、首字和输出",
    colModel: "模型", colEndpoint: "接口", colLastTest: "上次测试",
    empty: "还没有自定义模型，在下面添加第一个。", addModel: "添加模型",
    displayName: "显示名", type: "类型", modelName: "模型名", baseUrl: "接口地址", apiKey: "密钥",
    useProxy: "走代理", test: "测试", testing: "测试中…", add: "添加", del: "删除",
    showKey: "显示密钥", hideKey: "隐藏密钥",
    notTakenOver: "这次启动没有接管。", mitm: "接管代理 {url}",
    proxyOn: "生效中：Cursor 的联网经过这个代理。", proxyOff: "当前直连。",
    liveOn: "接管中", liveOff: "未接管",
    untested: "未测试", failed: "失败", testFailed: "测试失败", testFailedWith: "测试失败：{error}", unknownError: "未知错误",
    testDetail: "速度 {speed} tokens/s · 首字 {first} ms · 总耗时 {duration} ms · 输出 {tokens} tokens{estimated} · 返回：{output}",
    estimated: "（估算）", requestFailed: "请求失败 {status}",
    quitConfirm: "退出 cursor-inner？\n\nCursor 的代理设置会被还原，正在运行的 Cursor 会被关闭。",
    goneTitle: "cursor-inner 已退出", goneBody: "Cursor 的代理设置已还原，可以关闭这个页面。",
    switchLang: "EN"
  },
  en: {
    quit: "Quit", quitTitle: "Quit cursor-inner and restore Cursor's proxy settings",
    takeover: "Takeover", takeoverDesc: "Closes any running Cursor on start. Official models still come from Cursor; custom models are added to the end of the list.",
    proxy: "Proxy", proxyDesc: "Official models and the rest of Cursor's traffic go through this proxy. A bare host:port is treated as socks5; leave it empty for a direct connection.",
    save: "Save", autostart: "Start at login", autostartDesc: "Starts automatically after you log in. Toggling it repeatedly always leaves exactly one entry.",
    models: "Custom models", modelsHint: "Tests stream the numbers 1 to 120 and record speed, first token and output",
    colModel: "Model", colEndpoint: "Endpoint", colLastTest: "Last test",
    empty: "No custom models yet. Add the first one below.", addModel: "Add model",
    displayName: "Display name", type: "Type", modelName: "Model name", baseUrl: "Endpoint URL", apiKey: "API key",
    useProxy: "Use proxy", test: "Test", testing: "Testing…", add: "Add", del: "Delete",
    showKey: "Show key", hideKey: "Hide key",
    notTakenOver: "Takeover is not active in this session.", mitm: "Takeover proxy {url}",
    proxyOn: "Active: Cursor's traffic goes through this proxy.", proxyOff: "Direct connection.",
    liveOn: "Takeover active", liveOff: "Not taken over",
    untested: "Not tested", failed: "Failed", testFailed: "Test failed", testFailedWith: "Test failed: {error}", unknownError: "unknown error",
    testDetail: "{speed} tokens/s · first token {first} ms · total {duration} ms · {tokens} output tokens{estimated} · reply: {output}",
    estimated: " (estimated)", requestFailed: "Request failed {status}",
    quitConfirm: "Quit cursor-inner?\n\nCursor's proxy settings will be restored and any running Cursor will be closed.",
    goneTitle: "cursor-inner has quit", goneBody: "Cursor's proxy settings have been restored. You can close this page.",
    switchLang: "中文"
  }
};
const LANG_KEY = "cursor-inner-lang";
const storedLang = localStorage.getItem(LANG_KEY);
let lang = MESSAGES[storedLang] ? storedLang : ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
let lastState = null;

function t(key, vars) {
  let text = MESSAGES[lang][key] ?? MESSAGES.zh[key] ?? key;
  for (const [name, value] of Object.entries(vars || {})) text = text.replaceAll("{" + name + "}", value);
  return text;
}

function tr(value) {
  if (value == null) return "";
  if (typeof value === "string") return value;
  return value[lang] || value.zh || "";
}

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach((node) => { node.title = t(node.dataset.i18nTitle); });
  document.querySelectorAll("[data-i18n-aria]").forEach((node) => { node.setAttribute("aria-label", t(node.dataset.i18nAria)); });
  document.querySelector("#lang").textContent = t("switchLang");
  syncReveal();
  if (lastState) render(lastState);
}

const banner = document.querySelector("#banner");
const form = document.querySelector("#model-form");
let toastTimer = 0;

function toast(text, kind) {
  clearTimeout(toastTimer);
  banner.textContent = text || "";
  banner.className = "toast" + (text ? " show " + kind : "");
  if (text && kind === "ok") toastTimer = setTimeout(() => banner.classList.remove("show"), 6000);
}
function showError(text) { toast(text, "err"); }
banner.addEventListener("click", () => banner.classList.remove("show"));

function formatSpeed(value) {
  return Number.isFinite(value) ? value.toFixed(1) : "0.0";
}

function testDetail(result) {
  if (!result) return t("untested");
  if (!result.ok) return t("testFailedWith", {error: tr(result.error) || t("unknownError")});
  return t("testDetail", {
    speed: formatSpeed(result.tokens_per_second),
    first: result.first_valid_response_ms == null ? "--" : result.first_valid_response_ms,
    duration: result.duration_ms,
    tokens: result.output_tokens,
    estimated: result.tokens_estimated ? t("estimated") : "",
    output: result.output || "--"
  });
}

function testBadge(result) {
  const node = document.createElement("span");
  if (!result) {
    node.className = "speed idle";
    node.textContent = t("untested");
    return node;
  }
  node.className = "speed" + (result.ok ? "" : " bad");
  node.textContent = result.ok ? formatSpeed(result.tokens_per_second) + " tok/s" : t("failed");
  node.title = testDetail(result);
  return node;
}

function showTest(result) {
  if (result.ok) toast(testDetail(result), "ok");
  else showError(tr(result.error) || t("testFailed"));
}

async function send(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(tr(data.error) || t("requestFailed", {status: res.status}));
  return data;
}

function formModel() {
  const fd = new FormData(form);
  return {
    display_name: fd.get("display_name") || "",
    type: fd.get("type"),
    base_url: fd.get("base_url") || "",
    api_key: fd.get("api_key") || "",
    model: fd.get("model") || "",
    use_proxy: form.use_proxy.checked
  };
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function busy(button, label, run) {
  const old = button.textContent;
  button.disabled = true;
  button.textContent = label;
  return run().finally(() => { button.disabled = false; button.textContent = old; });
}

function render(state) {
  lastState = state;
  const listen = document.querySelector("#listen");
  document.querySelector("#listen-text").textContent = state.listen_url || "";
  listen.href = state.listen_url || "/";
  document.querySelector("#live-dot").className = "dot" + (state.takeover_active ? " on" : "");
  listen.title = state.takeover_active ? t("liveOn") : t("liveOff");

  document.querySelector("#takeover").checked = !!state.takeover_active;
  const meta = document.querySelector("#takeover-meta");
  const lastError = tr(state.last_error);
  meta.className = "meta" + (lastError ? " warn" : "");
  const bits = [];
  if (state.takeover && !state.takeover_active) bits.push(t("notTakenOver"));
  if (state.takeover_active && state.mitm_url) bits.push(t("mitm", {url: state.mitm_url}));
  for (const text of [tr(state.ca_detail), tr(state.catalog_warning), lastError]) if (text) bits.push(text);
  meta.textContent = bits.join("\n");

  document.querySelector("#proxy-on").checked = !!state.proxy.enabled;
  const address = document.querySelector("#proxy-address");
  if (document.activeElement !== address) address.value = state.proxy.address || "";
  document.querySelector("#proxy-meta").textContent = state.proxy.effective ? t("proxyOn") : t("proxyOff");
  document.querySelector("#autostart").checked = !!state.autostart.enabled;
  document.querySelector("#boot-meta").textContent = tr(state.autostart.detail);

  const box = document.querySelector("#models");
  box.replaceChildren();
  const none = state.models.length === 0;
  document.querySelector("#empty").hidden = !none;
  document.querySelector("#model-table").hidden = none;
  document.querySelector("#model-count").textContent = state.models.length;
  for (const model of state.models) {
    const tr_ = el("tr");
    const who = el("td");
    who.append(el("div", "name", model.display_name), el("div", "sub mono", model.model));
    const api = el("td");
    const apiInner = el("div", "api");
    const url = el("span", "url mono", model.base_url);
    url.title = model.base_url;
    apiInner.append(el("span", "tag", model.type), url);
    if (model.key_hint) apiInner.append(el("span", "mono", model.key_hint));
    api.append(apiInner);
    const last = el("td");
    last.append(testBadge(model.last_test));

    const ops = el("td", "ops");
    const inner = el("div", "ops-inner");
    const proxy = el("label", "mini");
    const sw = el("span", "switch sm");
    const checkbox = el("input");
    checkbox.type = "checkbox";
    checkbox.checked = model.use_proxy;
    checkbox.addEventListener("change", () => act(() => send("/api/models/" + model.id, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({use_proxy: checkbox.checked})
    })));
    sw.append(checkbox, el("span"));
    proxy.append(sw, document.createTextNode(t("useProxy")));
    const test = el("button", "sm", t("test"));
    test.type = "button";
    test.addEventListener("click", () => busy(test, t("testing"), () => act(async () => {
      const result = await send("/api/models/" + model.id + "/test", {method: "POST"});
      showTest(result);
      return send("/api/state");
    })));
    const del = el("button", "sm danger", t("del"));
    del.type = "button";
    del.addEventListener("click", () => act(() => send("/api/models/" + model.id, {method: "DELETE"})));
    inner.append(proxy, test, del);
    ops.append(inner);
    tr_.append(who, api, last, ops);
    box.append(tr_);
  }
}

async function act(fn) {
  try {
    const state = await fn();
    if (state) render(state);
  } catch (err) {
    showError(err.message);
    load();
  }
}

async function load() {
  try {
    render(await send("/api/state"));
  } catch (err) {
    showError(err.message);
  }
}

document.querySelector("#lang").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem(LANG_KEY, lang);
  applyLang();
});
document.querySelector("#takeover").addEventListener("change", (event) => {
  act(() => send("/api/takeover", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled: event.target.checked})}));
});
document.querySelector("#autostart").addEventListener("change", (event) => {
  act(() => send("/api/autostart", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({enabled: event.target.checked})}));
});
document.querySelector("#proxy-save").addEventListener("click", () => {
  act(() => send("/api/proxy", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
    enabled: document.querySelector("#proxy-on").checked,
    address: document.querySelector("#proxy-address").value
  })}));
});
form.addEventListener("submit", (event) => {
  event.preventDefault();
  act(async () => {
    const state = await send("/api/models", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(formModel())});
    form.reset();
    return state;
  });
});
const draftTest = document.querySelector("#draft-test");
draftTest.addEventListener("click", () => busy(draftTest, t("testing"), () => act(async () => {
  const result = await send("/api/models/test", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(formModel())});
  showTest(result);
  return null;
})));
document.querySelector("#quit").addEventListener("click", async () => {
  if (!confirm(t("quitConfirm"))) return;
  try {
    await send("/api/quit", {method: "POST"});
    const gone = el("div", "gone");
    gone.append(el("h2", "", t("goneTitle")), el("p", "", t("goneBody")));
    document.querySelector("main").replaceChildren(gone);
    banner.classList.remove("show");
  } catch (err) {
    showError(err.message);
  }
});

function syncReveal() {
  const shown = document.querySelector("#api-key").type === "text";
  const button = document.querySelector("#reveal-key");
  button.title = shown ? t("hideKey") : t("showKey");
  button.setAttribute("aria-label", button.title);
}
document.querySelector("#reveal-key").addEventListener("click", () => {
  const input = document.querySelector("#api-key");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  document.querySelector("#eye-on").hidden = !show;
  document.querySelector("#eye-off").hidden = show;
  syncReveal();
});
applyLang();
load();
</script>
</body>
</html>
